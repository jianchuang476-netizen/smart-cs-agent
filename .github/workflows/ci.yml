name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite+aiosqlite:///./data/test_smart_cs.db
      CHECKPOINT_BACKEND: memory
      REDIS_URL: redis://127.0.0.1:6399/15
      JWT_SECRET_KEY: ci-secret-key
      DEEPSEEK_API_KEY: test-key
      AUTO_CREATE_TABLES: "true"
      AUTO_SEED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smart-cs-agent:test .
      - run: docker build -t smart-cs-agent-frontend:test ./frontend
